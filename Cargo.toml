[package]
name = "composite"
version = "0.2.0"
edition = "2024"
description = "Ready-to-use Discord overlay rendering with Wry, ImGui, and D3D11 textures"

[lib]
name = "composite"
path = "src/lib.rs"

[dependencies]
imgui = "0.8"
imgui-dx11-renderer = "0.8"
raw-window-handle = "0.6"
serde_json = "1"
thiserror = "2"
wry = { version = "0.55.1", features = ["transparent"] }
wio = "0.2"
windows-036 = { package = "windows", version = "0.36", features = [
    "Win32_Graphics_Direct3D11",
] }

[dependencies.winapi]
version = "0.3"
features = [
    "d3d9",
    "d3d9caps",
    "d3d9types",
    "winerror",
]

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Foundation",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[patch.crates-io]
imgui-dx11-renderer = { path = "vendor/imgui-dx11-renderer" }
